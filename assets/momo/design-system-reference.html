<style>
  :root {
    --ink: #1A1A1A; --text: #404040; --muted: #767676; --line: #E6E6E6; --line-soft: #F0F0F0;
    --accent: #D62872;
    --mono: ui-monospace, "SF Mono", "Cascadia Mono", Menlo, Consolas, monospace;
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; padding: 0; background: #fff; }
  body { -webkit-font-smoothing: antialiased; color: var(--ink);
    font-family: "Microsoft JhengHei", "PingFang TC", "Noto Sans TC", system-ui, sans-serif; }
  #root { min-height: 100vh; }
  button { font-family: inherit; }
  ::selection { background: #FBE9F1; }
  button:focus-visible, input:focus-visible, select:focus-visible, textarea:focus-visible, a:focus-visible {
    outline: 2px solid var(--accent); outline-offset: 2px; border-radius: 4px;
  }
  .nav-item { transition: background .15s; }
  .nav-item:hover { background: #F0F0F0; }
  .nav-item[aria-current="page"] { background: #EFEFEF; color: var(--ink); font-weight: 600; box-shadow: inset 2px 0 0 var(--accent); }
  .seg-btn { transition: background .15s, color .15s; }
  .app-content::-webkit-scrollbar, .app-nav::-webkit-scrollbar { width: 8px; height: 8px; }
  .app-content::-webkit-scrollbar-thumb, .app-nav::-webkit-scrollbar-thumb { background: #D9D9D9; border-radius: 4px; }
  @media (max-width: 860px) {
    .app-shell { flex-direction: column !important; height: auto !important; min-height: 100vh; }
    .app-sidebar { width: 100% !important; border-right: none !important; border-bottom: 1px solid var(--line); }
    .app-nav { display: flex !important; flex-direction: row !important; gap: 4px; overflow-x: auto !important; padding: 4px 12px 10px !important; }
    .app-nav > div { display: contents; }
    .app-nav-label, .app-sidebar-foot { display: none !important; }
    .nav-item { width: auto !important; white-space: nowrap; }
    .app-main { overflow: visible !important; }
    .app-topbar { padding: 0 16px !important; }
    .app-content { padding: 24px 16px 56px !important; overflow: visible !important; }
  }
  @media (prefers-reduced-motion: reduce) {
    *, *::before, *::after { transition: none !important; animation: none !important; }

function isDark(hex) {
  const r = parseInt(hex.slice(1, 3), 16);
  const g = parseInt(hex.slice(3, 5), 16);
  const b = parseInt(hex.slice(5, 7), 16);
  return (r * 299 + g * 587 + b * 114) / 1000 < 128;

function Badge({ children, color = "#767676" }) {
  return (
    <span style={{ color, fontSize: 11, fontWeight: 500, padding: "1px 7px", borderRadius: 4, border: `1px solid ${color}55`, whiteSpace: "nowrap" }}>
      {children}
    </span>
  );
}

function TokenTag({ children }) {
  return (
    <code style={{ fontFamily: "var(--mono)", fontSize: 12, color: "#1A1A1A", background: "#F5F5F5", padding: "1px 6px", borderRadius: 4, display: "inline-block", lineHeight: "18px" }}>
      {children}
    </code>
  );
}

function CopyBtn({ text }) {
  const [copied, setCopied] = useState(false);
  return (
    <button
      onClick={() => { navigator.clipboard?.writeText(text); setCopied(true); setTimeout(() => setCopied(false), 1500); }}
      style={{ background: "none", border: "none", cursor: "pointer", color: copied ? "#1F7C1D" : "#767676", fontSize: 11, padding: "0 4px" }}
      aria-label="Copy"
    >{copied ? "Copied" : "Copy"}</button>
  );
}

function SectionHeader({ title, desc }) {
  return (
    <header style={{ marginBottom: 28, maxWidth: 760 }}>
      <h2 style={{ margin: 0, fontSize: 26, fontWeight: 700, color: "#1A1A1A", letterSpacing: "-0.01em", lineHeight: 1.25 }}>{title}</h2>
      {desc && <p style={{ margin: "10px 0 0", fontSize: 14, color: "#6B6B6B", lineHeight: 1.75 }}>{desc}</p>}
    </header>
  );
}

function SubTitle({ children, note }) {
  return (
    <div style={{ display: "flex", alignItems: "baseline", gap: 10, margin: "32px 0 12px" }}>
      <h3 style={{ margin: 0, fontSize: 14, fontWeight: 600, color: "#1A1A1A" }}>{children}</h3>
      {note && <span style={{ fontSize: 12, color: "#767676" }}>{note}</span>}
    </div>
  );
}

function Table({ headers, rows, widths }) {
  return (
    <div style={{ overflowX: "auto", border: "1px solid #E6E6E6", borderRadius: 6, marginBottom: 24 }}>
      <table style={{ width: "100%", borderCollapse: "collapse", fontSize: 13 }}>
        <thead>
          <tr>
            {headers.map((h, i) => (
              <th key={i} style={{ padding: "9px 14px", textAlign: "left", fontWeight: 500, color: "#767676", fontSize: 12, whiteSpace: "nowrap", width: widths?.[i], background: "#FAFAFA", borderBottom: "1px solid #E6E6E6" }}>
                {h}
              </th>
            ))}
          </tr>
        </thead>
        <tbody>
          {rows.map((row, i) => (
            <tr key={i} style={{ borderBottom: i < rows.length - 1 ? "1px solid #F0F0F0" : "none" }}>
              {row.map((cell, j) => (
                <td key={j} style={{ padding: "10px 14px", verticalAlign: "middle", color: "#404040", lineHeight: 1.5 }}>
                  {cell}
                </td>
              ))}
            </tr>
          ))}
        </tbody>
      </table>
    </div>
  );
}

// ─── SECTION: OVERVIEW ───────────────────────────────────────────────────────
function OverviewSection({ tokens, onNavigate }) {
  const n = (k, l) => tokens[k]?.[l]?.length ?? "—";
  const foundations = [
    { id: "color", label: "Color" },
    { id: "typography", label: "Typography" },
    { id: "spacing", label: "Spacing" },
    { id: "radius", label: "Border Radius" },
    { id: "shadow", label: "Shadow" },
    { id: "motion", label: "Motion" },
    { id: "zindex", label: "Z-index" },
  ];
  const num = (v) => <span style={{ fontVariantNumeric: "tabular-nums", color: v === "—" ? "#767676" : "#1A1A1A" }}>{v}</span>;
  const todo = [
    "Font weight is missing a medium (500) level; recommend adding it",
    "Container padding (container-*) is Web only for now; native to be added",
    "Dark mode semantic layer not yet created",
    "legal-01 temporarily shares the helper-text-01 spec; designer to confirm whether a separate size is needed",
    "Color has no component reference layer yet; button colors currently sit directly in the semantic layer",
  ];
  return (
    <div>
      <header style={{ marginBottom: 40, maxWidth: 680 }}>
        <div style={{ fontSize: 13, color: "#767676", marginBottom: 10 }}>momo Design System</div>
        <h1 style={{ margin: 0, fontSize: 36, fontWeight: 700, lineHeight: 1.2, color: "#1A1A1A", letterSpacing: "-0.02em" }}>Design Tokens</h1>
        <p style={{ margin: "14px 0 0", fontSize: 15, color: "#6B6B6B", lineHeight: 1.8 }}>
          The primitive layer defines raw values, the semantic layer expresses purpose, and the component reference layer records which token each component actually uses. Naming follows IBM Carbon's sequential numbering convention, and the content can be imported into Figma Variables.
        </p>
      </header>

      <SubTitle note="Token count per layer">Foundation</SubTitle>
      <Table
        headers={["Category", "Primitive", "Semantic", "Component reference"]}
        widths={[null, 120, 120, 120]}
        rows={foundations.map(f => [
          <button onClick={() => onNavigate(f.id)} style={{ background: "none", border: "none", padding: 0, cursor: "pointer", fontSize: 13, fontWeight: 600, color: "#1A1A1A", textDecoration: "underline", textDecorationColor: "#C6C6C6", textUnderlineOffset: 3 }}>{f.label}</button>,
          num(n(f.id, "primitive")), num(n(f.id, "semantic")), num(n(f.id, "component")),
        ])}
      />

      <SubTitle>Open items</SubTitle>
      <ul style={{ margin: "0 0 24px", paddingLeft: 18, fontSize: 14, color: "#404040", lineHeight: 2 }}>
        {todo.map((t, i) => <li key={i}>{t}</li>)}
      </ul>

      <SubTitle>Components</SubTitle>
      <p style={{ margin: 0, fontSize: 14, color: "#404040", lineHeight: 1.8 }}>
        Specification pages exist for Button, Chip, and Stepper; remaining components will be developed in phase 2.
      </p>
    </div>
  );
}

// ─── LAYER TABS ──────────────────────────────────────────────────────────────
function LayerTabs({ tabs, active, onChange }) {
  return (
    <div role="tablist" style={{ display: "flex", gap: 28, borderBottom: "1px solid #E6E6E6", marginBottom: 28, overflowX: "auto" }}>
      {tabs.map(t => {
        const on = active === t.id;
        return (
          <button
            key={t.id} role="tab" aria-selected={on}
            onClick={() => onChange(t.id)}
            style={{
              padding: "10px 0", background: "none", border: "none", cursor: "pointer", whiteSpace: "nowrap",
              fontSize: 14, fontWeight: on ? 600 : 400, color: on ? "#1A1A1A" : "#767676",
              borderBottom: on ? "2px solid #D62872" : "2px solid transparent", marginBottom: -1,
              display: "flex", alignItems: "baseline", gap: 6, transition: "color .15s",
            }}
          >
            {t.label}
            {t.note && <span style={{ fontSize: 11, color: "#8C590D", fontWeight: 400 }}>{t.note}</span>}
            {t.count != null && <span style={{ fontSize: 12, color: "#767676", fontWeight: 400, fontVariantNumeric: "tabular-nums" }}>{t.count}</span>}
          </button>
        );
      })}
    </div>
  );
}

// ─── SECTION: COLOR ───────────────────────────────────────────────────────────
function ColorSection({ tokens, viewMode }) {
  const [layer, setLayer] = useState("primitive");
  const groups = [...new Set(tokens.color.primitive.map(t => t.group))];
  const engineer = viewMode === "engineer";
  const catLabels = { text: "Text", bg: "Background", border: "Border", button: "Button", icon: "Icon", status: "Status", brand: "Brand" };

  return (
    <div>
      <SectionHeader title="Color" desc="The primitive layer defines hues and 10-step ramps; the semantic layer groups colors by purpose. In development, reference only the semantic layer — do not hard-code HEX values." />
      <LayerTabs
        tabs={[
          { id: "primitive", label: "Primitive", count: tokens.color.primitive.length },
          { id: "semantic", label: "Semantic", count: tokens.color.semantic.length },
        ]}
        active={layer} onChange={setLayer}
      />

      {layer === "primitive" && (
        <div style={{ borderTop: "1px solid #F0F0F0" }}>
          {groups.map(g => {
            const items = tokens.color.primitive.filter(t => t.group === g);
            const ramp = items.length === 10;
            const label = (t) => g === "Special" ? t.token.replace("special-", "") : t.token.split("-").pop();
            return (
              <div key={g} style={{ display: "grid", gridTemplateColumns: "132px minmax(0, 1fr)", gap: 16, padding: "16px 0", borderBottom: "1px solid #F0F0F0", alignItems: "start" }}>
                <div style={{ fontSize: 13, fontWeight: 600, color: "#1A1A1A", paddingTop: 2 }}>{g}</div>
                <div style={{ overflowX: "auto" }}>
                  <div style={{ display: "grid", gridTemplateColumns: ramp ? "repeat(10, minmax(52px, 1fr))" : "repeat(auto-fill, 84px)", gap: ramp ? 0 : 8 }}>
                    {items.map((t, i) => (
                      <div key={t.token} title={`${t.token}  ${t.value}`}>
                        <div style={{
                          height: 36, background: t.value, boxShadow: "inset 0 0 0 1px rgba(0,0,0,0.06)",
                          borderRadius: ramp ? (i === 0 ? "4px 0 0 4px" : i === items.length - 1 ? "0 4px 4px 0" : 0) : 4,
                        }} />
                        <div style={{ fontSize: 12, color: "#1A1A1A", marginTop: 6 }}>{label(t)}</div>
                        <div style={{ fontSize: 11, color: "#767676", fontFamily: "var(--mono)" }}>{t.value}</div>
                      </div>
                    ))}
                  </div>
                </div>
              </div>
            );
          })}
        </div>
      )}

      {layer === "semantic" && (
        <div>
          {["text", "bg", "border", "button", "icon", "status", "brand"].map(cat => {
            const items = tokens.color.semantic.filter(t => t.token.startsWith(cat));
            if (!items.length) return null;
            const headers = ["", "Token", "Primitive reference", "HEX", "Usage"].concat(engineer ? ["CSS variable"] : []);
            return (
              <div key={cat}>
                <SubTitle note={String(items.length)}>{catLabels[cat]}</SubTitle>
                <Table
                  headers={headers}
                  widths={[44]}
                  rows={items.map(t => [
                    <span style={{ display: "block", width: 24, height: 24, borderRadius: 4, background: t.value, boxShadow: "inset 0 0 0 1px rgba(0,0,0,0.08)" }} />,
                    <TokenTag>{t.token}</TokenTag>,
                    <span style={{ fontFamily: "var(--mono)", fontSize: 12, color: "#6B6B6B" }}>{t.base}</span>,
                    <span style={{ fontFamily: "var(--mono)", fontSize: 12 }}>{t.value}</span>,
                    <span style={{ color: "#6B6B6B" }}>{t.usage}</span>,
                  ].concat(engineer ? [<span style={{ whiteSpace: "nowrap" }}><code style={{ fontFamily: "var(--mono)", fontSize: 12, color: "#0E5496" }}>{t.css}</code><CopyBtn text={`var(${t.css})`} /></span>] : []))}
                />
              </div>
            );
          })}
        </div>
      )}
    </div>
  );
}

// ─── SECTION: TYPOGRAPHY ─────────────────────────────────────────────────────

            />
          </div>
        </div>
      )}

      {layer === "semantic" && (
        <div>
          {["number", "heading", "body", "label", "helper-text", "legal"].map(cat => {
            const items = tokens.typography.semantic.filter(t => t.category === cat);
            if (!items.length) return null;
            const catLabels = { number: "Number", heading: "Heading", body: "Body", label: "Label", "helper-text": "Helper text", legal: "Legal" };

// ─── SECTION: SPACING ─────────────────────────────────────────────────────────

        tabs={[
          { id: "primitive", label: "Primitive", count: tokens.spacing.primitive.length },
          { id: "semantic", label: "Semantic", count: tokens.spacing.semantic.length },

        ]}

      />

// ─── SECTION: SHADOW ─────────────────────────────────────────────────────────
function ShadowSection({ tokens, viewMode }) {

      <div style={{ borderTop: "2px solid #EDEDED", paddingTop: 28, marginBottom: 8 }}>
        <div style={{ display: "flex", alignItems: "center", gap: 8, marginBottom: 8 }}>
          <h2 style={{ margin: 0, fontSize: 22, fontWeight: 700, color: "#262626" }}>Filter Chip</h2>
          <span style={{ background: "#1683E918", color: "#1683E9", fontSize: 11, fontWeight: 600, padding: "2px 8px", borderRadius: 20, border: "1px solid #1683E930" }}>Variant</span>
        </div>
        <p style={{ margin: "0 0 24px", fontSize: 14, color: "#666", lineHeight: 1.6 }}>Outlined Chip used for selecting filter criteria (PLP). The background is always white; the selected state is expressed through outline and text color changes, with a check badge in the bottom-right corner. Height 32px.</p>
      </div>

      <SubTitle>Use cases</SubTitle>
      <div style={{ border: "1px solid #EDEDED", borderRadius: 8, padding: 20, marginBottom: 24 }}>
        <div style={{ fontSize: 11, color: "#767676", fontWeight: 600, marginBottom: 14 }}>Context preview — product list filters (PLP)</div>
        <div style={{ display: "flex", flexWrap: "wrap", gap: 8 }}>
          <FilterChipComponent selected={true} label="Includes mo Store+ items" />
          <FilterChipComponent selected={false} label="Mega Subsidy" />
          <FilterChipComponent selected={false} label="moPro Members" />
          <FilterChipComponent selected={true} label="Free Shipping" />
        </div>
      </div>

      <SubTitle>States</SubTitle>
      <div style={{ display: "grid", gridTemplateColumns: "1fr 1fr", gap: 16, marginBottom: 24 }}>
        {[
          { label: "Unselected", selected: false, borderToken: "border-color-default", borderValue: "#F4F4F4", textToken: "text-color-primary", textValue: "#393939" },
          { label: "Selected", selected: true, borderToken: "button-color-primary", borderValue: "#DB3F81", textToken: "button-color-primary", textValue: "#DB3F81" },
        ].map(s => (
          <div key={s.label} style={{ border: "1px solid #EDEDED", borderRadius: 8, overflow: "hidden" }}>
            <div style={{ padding: "12px 16px", borderBottom: "1px solid #F2F2F2", background: "#FAFAFA" }}>
              <span style={{ fontSize: 13, fontWeight: 600, color: "#404040" }}>{s.label}</span>
            </div>
            <div style={{ padding: 16 }}>
              <div style={{ display: "flex", justifyContent: "center", marginBottom: 16 }}>
                <FilterChipComponent selected={s.selected} label="Includes mo Store+ items" />
              </div>
              <TokenRow label="Background" token="bg-color-white" value="#FFFFFF" color="#EDEDED" />
              <TokenRow label="Outline" token={s.borderToken} value={s.borderValue} color={s.borderValue} />
              <TokenRow label="Text color" token={s.textToken} value={s.textValue} color={s.textValue} />
              <TokenRow label="Typography" token="body-01" value="15/20/400" />
              <TokenRow label="Radius" token="shape-03" value="6px" />
              <TokenRow label="Horizontal padding" token="inset-02" value="12px (was 10px; aligned to the 4px grid)" />
              <TokenRow label="Height" token="—" value="32px (fixed)" />
              {s.selected && <TokenRow label="Badge background" token="button-color-primary" value="#DB3F81" color="#DB3F81" />}
            </div>
          </div>
        ))}
      </div>

      <SubTitle>Chip vs Filter Chip differences</SubTitle>
      <Table
        headers={["Property", "Chip", "Filter Chip"]}
        rows={[
          ["Height", "30px", "32px"],
          ["Background (unselected)", "#F2F2F2", "#FFFFFF"],
          ["Selected indication", "Background fill", "Outline + text color + badge"],
          ["Weight", "400 regular", "400 regular"],
          ["Horizontal padding", "8px", "10px"],
          ["Use case", "Product spec selection (PDP)", "Filter criteria (PLP)"],
        ].map(r => r.map((c, i) => i === 0
          ? <span style={{ fontSize: 13, fontWeight: 600, color: "#404040" }}>{c}</span>
          : <span style={{ fontSize: 13, color: "#666" }}>{c}</span>
        ))}
      />
    </div>
  );
}

// ─── SECTION: STEPPER ────────────────────────────────────────────────────────
function StepperButton({ side, disabled }) {
  const radius = side === "minus"
    ? "2px 0 0 2px"
    : "0 2px 2px 0";
  const iconColor = disabled ? "#E6E6E6" : "#CCCCCC";

  return (
    <div style={{
      width: 30, height: 30, background: "#F2F2F2",
      borderRadius: radius, display: "flex",
      alignItems: "center", justifyContent: "center",
      flexShrink: 0, cursor: disabled ? "not-allowed" : "pointer",
    }}>
      {side === "minus" ? (
        <div style={{ width: 13, height: 2, background: iconColor, borderRadius: 1 }} />
      ) : (
        <div style={{ position: "relative", width: 13, height: 13 }}>
          <div style={{ position: "absolute", top: "50%", left: 0, width: 13, height: 2, background: iconColor, borderRadius: 1, transform: "translateY(-50%)" }} />
          <div style={{ position: "absolute", left: "50%", top: 0, width: 2, height: 13, background: iconColor, borderRadius: 1, transform: "translateX(-50%)" }} />
        </div>
      )}
    </div>
  );
}

function StepperSection({ viewMode }) {
  return (
    <div>
      <SectionHeader title="Stepper"
        desc="Quantity plus/minus control, used on the PDP product detail page. One 30×30px button on each side with the number in the middle. Asymmetric corner radii make the two buttons read as one unit." />

      {/* Use cases */}
      <SubTitle>Use cases</SubTitle>
      <div style={{ border: "1px solid #EDEDED", borderRadius: 8, padding: 20, marginBottom: 24 }}>
        <div style={{ fontSize: 11, color: "#767676", fontWeight: 600, marginBottom: 14 }}>Context preview — PDP purchase quantity (quantity is 1, minus is disabled)</div>
        <div style={{ display: "flex", alignItems: "center", gap: 12 }}>
          <span style={{ fontSize: 15, color: "#404040" }}>Quantity</span>
          <span style={{ fontSize: 13, color: "#767676" }}>Limit per order</span>
          <span style={{ fontSize: 15, color: "#D62872", fontWeight: 700 }}>1</span>
          <span style={{ fontSize: 13, color: "#767676" }}>sets</span>
          <div style={{ marginLeft: "auto", display: "flex", alignItems: "center", gap: 12 }}>
            <StepperButton side="minus" disabled={true} />
            <span style={{ fontSize: 15, color: "#404040", fontFamily: "Century Gothic, Arial", fontWeight: 400, minWidth: 16, textAlign: "center" }}>1</span>
            <StepperButton side="plus" disabled={false} />
          </div>
        </div>
      </div>

      {/* States */}
      <SubTitle>States</SubTitle>
      <div style={{ display: "grid", gridTemplateColumns: "1fr 1fr", gap: 16, marginBottom: 24 }}>
        {[
          { label: "Default (Plus / actionable)", side: "plus", disabled: false, stateLabel: "default", bgToken: "bg-color-light-grey", iconToken: "gray-30", iconValue: "#C6C6C6" },
          { label: "Disabled (Minus at minimum value)", side: "minus", disabled: true, stateLabel: "disabled", bgToken: "bg-color-light-grey", iconToken: "gray-20", iconValue: "#E0E0E0" },
        ].map(s => (
          <div key={s.stateLabel} style={{ border: "1px solid #EDEDED", borderRadius: 8, overflow: "hidden" }}>
            <div style={{ padding: "12px 16px", borderBottom: "1px solid #F2F2F2", background: "#FAFAFA" }}>
              <div style={{ fontSize: 13, fontWeight: 600, color: "#404040" }}>{s.label}</div>
            </div>
            <div style={{ padding: 16 }}>
              <div style={{ display: "flex", justifyContent: "center", marginBottom: 16 }}>
                <StepperButton side={s.side} disabled={s.disabled} />
              </div>
              <TokenRow label="Background" token={s.bgToken} value="#F2F2F2" color="#F2F2F2" />
              <TokenRow label="Icon color" token={s.iconToken} value={s.iconValue} color={s.iconValue} />
              <TokenRow label="Size" token="—" value="30×30px (fixed)" />
              <TokenRow label="Radius (minus)" token="shape-01 left" value="2px 0 0 2px" />
              <TokenRow label="Radius (plus)" token="shape-01 right" value="0 2px 2px 0" />
            </div>
          </div>
        ))}
      </div>

      {/* Number display */}
      <SubTitle>Number display</SubTitle>
      <div style={{ border: "1px solid #EDEDED", borderRadius: 8, padding: 16, marginBottom: 24 }}>
        <div style={{ display: "flex", alignItems: "center", justifyContent: "center", gap: 12, marginBottom: 16 }}>
          <StepperButton side="minus" disabled={true} />
          <span style={{ fontSize: 15, color: "#404040", fontFamily: "Century Gothic, Arial", minWidth: 24, textAlign: "center" }}>1</span>
          <StepperButton side="plus" disabled={false} />
        </div>
        <TokenRow label="Typography" token="number-01" value="15/20/400" />
        <TokenRow label="Typeface" token="text-family-number" value="Century Gothic" />
        <TokenRow label="Text color" token="text-color-primary" value="#404040" />
      </div>
    </div>
  );
}

// ─── SECTION: FILTER CHIP ────────────────────────────────────────────────────
function FilterChipComponent({ selected, label = "Includes mo Store+ items" }) {
  return (
    <div style={{
      position: "relative", display: "inline-flex", alignItems: "center",
      justifyContent: "center", gap: 10, height: 32, minWidth: 80,
      padding: "0 12px", background: "#FFFFFF", borderRadius: 6,
      outline: `1px solid ${selected ? "#DB3F81" : "#F4F4F4"}`,
      outlineOffset: -1, boxSizing: "border-box", cursor: "pointer",
      overflow: "hidden",
    }}>
      <span style={{
        fontSize: 15, fontFamily: "Microsoft JhengHei", fontWeight: 400,
        lineHeight: "20px", color: selected ? "#DB3F81" : "#393939",
        textAlign: "center", whiteSpace: "nowrap",
      }}>{label}</span>
      {selected && (
        <div style={{ position: "absolute", left: 103, top: 20, width: 12, height: 12 }}>
          {/* Pink background, rounded bottom-right corner only (rounded-br-sm) */}
          <div style={{
            position: "absolute", left: 0, top: 0,
            width: 12, height: 12,
            background: "#DB3F81",
            borderRadius: "0 0 4px 0",
          }} />
          {/* White check mark 5×4px, left:5 top:6 */}
          <div style={{
            position: "absolute", left: 5, top: 6,
            width: 5, height: 4,
            background: "white",
          }} />
        </div>
      )}
    </div>
  );
}


// ─── ADMIN PANEL ─────────────────────────────────────────────────────────────
function AdminPanel({ tokens, onUpdate, onClose }) {
  const [section, setSection] = useState("color");
  const [layer, setLayer] = useState("semantic");
  const [editIdx, setEditIdx] = useState(null);
  const [editData, setEditData] = useState({});
  const [saveMsg, setSaveMsg] = useState("");

  const current = tokens[section]?.[layer] || [];
  const fields = current[0] ? Object.keys(current[0]) : [];

  function startEdit(i) {
    setEditIdx(i);
    setEditData({ ...current[i] });
  }

  function saveEdit() {
    const updated = { ...tokens };
    updated[section][layer][editIdx] = { ...editData };
    onUpdate(updated);
    setEditIdx(null);
    setSaveMsg("Saved ✓");
    setTimeout(() => setSaveMsg(""), 2000);
  }

  return (
    <div style={{ position: "fixed", inset: 0, background: "rgba(0,0,0,0.5)", zIndex: 9999, display: "flex", alignItems: "flex-end", justifyContent: "flex-end" }}>
      <div style={{ width: 680, height: "100vh", background: "#fff", boxShadow: "0px 8px 24px rgba(0,0,0,0.14)", display: "flex", flexDirection: "column" }}>
        <div style={{ padding: "20px 24px", borderBottom: "1px solid #EDEDED", display: "flex", justifyContent: "space-between", alignItems: "center", background: "#262626" }}>
          <div>
            <div style={{ color: "#fff", fontWeight: 700, fontSize: 16 }}>Admin</div>
            <div style={{ color: "#767676", fontSize: 12, marginTop: 2 }}>Token editor</div>
          </div>
          <button onClick={onClose} style={{ background: "none", border: "none", color: "#fff", fontSize: 20, cursor: "pointer" }}>✕</button>
        </div>

        <div style={{ padding: "16px 24px", borderBottom: "1px solid #EDEDED", display: "flex", gap: 8, flexWrap: "wrap" }}>
          {["color","typography","spacing","radius","shadow","motion","zindex"].map(s => (
            <button key={s} onClick={() => { setSection(s); setLayer("semantic"); setEditIdx(null); }}
              style={{ padding: "6px 14px", borderRadius: 6, border: "1px solid", borderColor: section === s ? "#D62872" : "#EDEDED", background: section === s ? "#D62872" : "#fff", color: section === s ? "#fff" : "#404040", fontSize: 12, cursor: "pointer", fontWeight: section === s ? 600 : 400 }}>
              {s}
            </button>
          ))}
          <div style={{ display: "flex", gap: 4, marginLeft: "auto" }}>
            {["primitive","semantic"].map(l => (
              <button key={l} onClick={() => { setLayer(l); setEditIdx(null); }}
                style={{ padding: "6px 14px", borderRadius: 6, border: "1px solid", borderColor: layer === l ? "#404040" : "#EDEDED", background: layer === l ? "#404040" : "#fff", color: layer === l ? "#fff" : "#404040", fontSize: 12, cursor: "pointer" }}>
                {l === "primitive" ? "Primitive" : "Semantic"}
              </button>
            ))}
          </div>
        </div>

        {saveMsg && (
          <div style={{ background: "#EBFAEA", color: "#269B24", padding: "8px 24px", fontSize: 13, fontWeight: 600 }}>{saveMsg}</div>
        )}

        <div style={{ flex: 1, overflow: "auto", padding: "16px 24px" }}>
          {current.map((row, i) => (
            <div key={i} style={{ border: "1px solid #EDEDED", borderRadius: 6, padding: "12px 14px", marginBottom: 8, background: editIdx === i ? "#FBE9F1" : "#fff" }}>
              {editIdx === i ? (
                <div>
                  {fields.map(f => (
                    <div key={f} style={{ marginBottom: 8 }}>
                      <label style={{ fontSize: 11, color: "#767676", display: "block", marginBottom: 3, fontWeight: 600 }}>{f}</label>
                      <input
                        value={editData[f] || ""}
                        onChange={e => setEditData({ ...editData, [f]: e.target.value })}
                        style={{ width: "100%", padding: "6px 10px", border: "1px solid #D62872", borderRadius: 4, fontSize: 13, boxSizing: "border-box", outline: "none" }}
                      />
                    </div>
                  ))}
                  <div style={{ display: "flex", gap: 8, marginTop: 12 }}>
                    <button onClick={saveEdit} style={{ padding: "8px 20px", background: "#D62872", color: "#fff", border: "none", borderRadius: 6, cursor: "pointer", fontSize: 13, fontWeight: 600 }}>Save</button>
                    <button onClick={() => setEditIdx(null)} style={{ padding: "8px 16px", background: "#F2F2F2", color: "#404040", border: "none", borderRadius: 6, cursor: "pointer", fontSize: 13 }}>Cancel</button>
                  </div>
                </div>
              ) : (
                <div style={{ display: "flex", justifyContent: "space-between", alignItems: "center" }}>
                  <div>
                    <code style={{ fontSize: 12, color: "#D62872", fontFamily: "var(--mono)" }}>{row.token}</code>
                    {row.value && <span style={{ fontSize: 12, color: "#767676", marginLeft: 10 }}>{row.value}</span>}
                    {row.usage && <div style={{ fontSize: 11, color: "#767676", marginTop: 2 }}>{row.usage}</div>}
                  </div>
                  <button onClick={() => startEdit(i)} style={{ padding: "5px 12px", border: "1px solid #EDEDED", borderRadius: 4, background: "#fff", color: "#404040", fontSize: 12, cursor: "pointer", whiteSpace: "nowrap" }}>Edit</button>
                </div>
              )}
            </div>
          ))}
        </div>
      </div>
    </div>
  );
}

// ─── MAIN APP ─────────────────────────────────────────────────────────────────
function App() {
  const [activeSection, setActiveSection] = useState("overview");
  const [viewMode, setViewMode] = useState("designer");
  const [showAdmin, setShowAdmin] = useState(false);
  const [tokens, setTokens] = useState(INITIAL_TOKENS);
  const [loaded, setLoaded] = useState(false);

  useEffect(() => {
    async function loadData() {
      try {
        const r = await window.storage.get("momo-tokens");
        if (r?.value) setTokens(JSON.parse(r.value));
      } catch (_) {}
      setLoaded(true);
    }
    loadData();
  }, []);

  const handleUpdate = useCallback(async (updated) => {
    setTokens(updated);
    try {
      await window.storage.set("momo-tokens", JSON.stringify(updated));
    } catch (_) {}
  }, []);

  if (!loaded) return <div style={{ display: "flex", alignItems: "center", justifyContent: "center", height: "100vh", color: "#767676", fontSize: 14 }}>Loading...</div>;

  const renderSection = () => {
    switch (activeSection) {
      case "overview": return <OverviewSection tokens={tokens} onNavigate={setActiveSection} />;
      case "color": return <ColorSection tokens={tokens} viewMode={viewMode} />;
      case "typography": return <TypographySection tokens={tokens} viewMode={viewMode} />;
      case "spacing": return <SpacingSection tokens={tokens} viewMode={viewMode} />;
      case "radius": return <RadiusSection tokens={tokens} viewMode={viewMode} />;
      case "shadow": return <ShadowSection tokens={tokens} viewMode={viewMode} />;
      case "motion": return <MotionSection tokens={tokens} viewMode={viewMode} />;
      case "zindex": return <ZIndexSection tokens={tokens} viewMode={viewMode} />;
      case "button": return <ButtonSection viewMode={viewMode} />;
      case "chip": return <ChipSection viewMode={viewMode} />;
      case "stepper": return <StepperSection viewMode={viewMode} />;
      default: return null;
    }
  };

  const current = NAV.find(n => n.id === activeSection);
  const groupLabel = current?.group === "component" ? "Components" : "Foundation";

  return (
    <div className="app-shell" style={{ display: "flex", height: "100vh", background: "#fff", color: "#1A1A1A" }}>
      {/* SIDEBAR */}
      <aside className="app-sidebar" style={{ width: 232, background: "#FAFAFA", borderRight: "1px solid #E6E6E6", display: "flex", flexDirection: "column", flexShrink: 0 }}>
        <div style={{ padding: "22px 20px 14px" }}>
          <img src="img/logo.png" alt="momo" onError={(e) => { e.currentTarget.onerror = null; e.currentTarget.src = LOGO_FALLBACK; }} style={{ display: "block", height: 30, width: "auto" }} />
          <div style={{ fontSize: 13, fontWeight: 600, color: "#1A1A1A", marginTop: 10 }}>Design System Design Tokens</div>
          <div style={{ fontSize: 12, color: "#767676", marginTop: 4 }}>v1.0 (2026.06)</div>
        </div>
        <nav className="app-nav" aria-label="Sections" style={{ flex: 1, padding: "4px 12px 12px", overflowY: "auto" }}>
          {[["foundation", "Foundation"], ["component", "Components"]].map(([g, label]) => (
            <div key={g} style={{ marginBottom: 16 }}>
              <div className="app-nav-label" style={{ fontSize: 12, color: "#767676", padding: "8px 10px 6px" }}>{label}</div>
              {NAV.filter(n => n.group === g).map(n => (
                <button
                  key={n.id}
                  className="nav-item"
                  onClick={() => setActiveSection(n.id)}
                  aria-current={activeSection === n.id ? "page" : undefined}
                  style={{ display: "block", width: "100%", textAlign: "left", padding: "7px 10px", marginBottom: 1, borderRadius: 4, border: "none", background: "transparent", color: "#404040", cursor: "pointer", fontSize: 13 }}
                >
                  {n.label}
                </button>
              ))}
            </div>
          ))}
        </nav>
        <div className="app-sidebar-foot" style={{ padding: 12, borderTop: "1px solid #E6E6E6" }}>
          <button onClick={() => setShowAdmin(true)}
            style={{ width: "100%", padding: "8px 12px", borderRadius: 4, background: "#fff", color: "#404040", border: "1px solid #D9D9D9", cursor: "pointer", fontSize: 13 }}>
            Admin
          </button>
        </div>
      </aside>

      {/* MAIN */}
      <div className="app-main" style={{ flex: 1, display: "flex", flexDirection: "column", overflow: "hidden", minWidth: 0 }}>
        <div className="app-topbar" style={{ height: 56, padding: "0 40px", borderBottom: "1px solid #E6E6E6", display: "flex", alignItems: "center", justifyContent: "space-between", flexShrink: 0, background: "#fff" }}>
          <div style={{ fontSize: 13, color: "#767676" }}>
            {groupLabel} / <span style={{ color: "#1A1A1A", fontWeight: 600 }}>{current?.label}</span>
          </div>
          <div role="group" aria-label="View mode" style={{ display: "flex", background: "#F2F2F2", borderRadius: 6, padding: 2, gap: 2 }}>
            {[["designer", "Designer"], ["engineer", "Engineer"]].map(([mode, label]) => (
              <button key={mode} className="seg-btn" onClick={() => setViewMode(mode)} aria-pressed={viewMode === mode}
                style={{ padding: "5px 14px", borderRadius: 4, border: "none", cursor: "pointer", fontSize: 12, fontWeight: viewMode === mode ? 600 : 400,
                  background: viewMode === mode ? "#fff" : "transparent",
                  color: viewMode === mode ? "#1A1A1A" : "#767676",
                  boxShadow: viewMode === mode ? "0 0 0 1px #E6E6E6" : "none" }}>
                {label}
              </button>
            ))}
          </div>
        </div>

        <main className="app-content" style={{ flex: 1, overflow: "auto", padding: "40px 40px 80px" }}>
          <div style={{ maxWidth: 1040, margin: "0 auto" }}>
            {renderSection()}
          </div>
        </main>
      </div>

      {showAdmin && <AdminPanel tokens={tokens} onUpdate={handleUpdate} onClose={() => setShowAdmin(false)} />}
    </div>
  );
}

const root = ReactDOM.createRoot(document.getElementById("root"));
root.render(<App />);
</script>
</body>
</html>
